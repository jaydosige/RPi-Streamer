[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pistreamer"
version = "0.1.0"
description = "NDI receiver and local media player node for Raspberry Pi 4B"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    # Pure Python, no dependencies of its own. The QR code has to be drawn on
    # the node: this runs on show networks with no route to the internet, where
    # a code rendered by a web service would simply not appear.
    "segno>=1.6",
    # Pillow is deliberately NOT listed. It is needed to draw the guest QR
    # panel for the *screen*, but pip builds it from source on a Pi; the
    # installer takes python3-pil from apt instead, and the venv is created
    # with --system-site-packages so it is visible. Guest sharing still works
    # without it — the browser QR is drawn by segno — the code just does not
    # appear on the output.
]

[project.scripts]
pistreamer = "pistreamer.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pistreamer = ["static/*"]
