[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pistreamer"
version = "0.1.0"
description = "NDI receiver and local media player node for Raspberry Pi 4B"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
]

[project.scripts]
pistreamer = "pistreamer.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pistreamer = ["static/*"]
